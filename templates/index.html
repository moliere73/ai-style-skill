<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>AI Style Skill</title>

    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            margin-top: 12px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        .output {
            margin-top: 30px;
            padding: 18px;
            background: #f4f4f4;
            border-radius: 8px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>AI Style Skill</h1>

    <p>
        Rewrite AI text using short, simple, and concise language.
    </p>

    <form method="post">
        <label for="text">Text to rewrite</label>

        <textarea
            id="text"
            name="text"
            placeholder="Paste AI-generated text here..."
            required
        >{{ original_text }}</textarea>

        <button type="submit">Rewrite</button>
    </form>

    {% if rewritten_text %}
        <section class="output">
            <h2>Rewritten text</h2>
            <p>{{ rewritten_text }}</p>
        </section>
    {% endif %}
</body>
</html>
